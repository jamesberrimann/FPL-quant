<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem("fpl_theme"),d=document.documentElement;var isDark=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme:dark)").matches);d.setAttribute("data-theme",isDark?"dark":"light");d.style.background=isDark?"#0a160d":"#f5f6f5";d.style.colorScheme=isDark?"dark":"light";})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <title>Chip Planner — FPL Tool</title>
  <link rel="stylesheet" href="/style.css?v=12">
  <style>
    /* FH pitch toggle */
    .fh-pitch-toggle {
      display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 0.5rem;
    }
    .fh-pitch-wrap {
      position: relative;
      background: #2e7d46;
      background-image: repeating-linear-gradient(180deg,
        transparent, transparent 48px, rgba(0,0,0,.055) 48px, rgba(0,0,0,.055) 96px);
      border-radius: 8px; overflow: hidden; aspect-ratio: 2/3;
    }
    .fh-player-node {
      position: absolute; display: flex; flex-direction: column;
      align-items: center; transform: translate(-50%, -50%);
    }
    .fh-shirt-wrap { position: relative; width: 34px; height: 37px; }
    .fh-shirt-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
    .fh-cap-dot {
      position: absolute; top: -4px; right: -6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #f59e0b; border: 2px solid #fff;
      font-size: 7px; font-weight: 800; color: #fff;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
    }
    .fh-cap-dot.vc { background: #94a3b8; }
    .fh-inj-dot {
      position: absolute; top: -4px; left: -6px;
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid #fff; font-size: 8px; font-weight: 900; color: #fff;
      display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .fh-inj-dot.out      { background: #dc2626; }
    .fh-inj-dot.doubtful { background: #f97316; }
    .fh-inj-dot.concern  { background: #eab308; color: #713f12; }
    .fh-plbl {
      font-size: 0.5rem; font-weight: 700; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
      white-space: nowrap; margin-top: 2px; text-transform: uppercase;
    }
    .fh-fix {
      font-size: 0.4375rem; font-weight: 600;
      color: rgba(255,255,255,.65);
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
      white-space: nowrap; margin-top: 1px;
    }
    .fh-fix.dgw { color: #fbbf24; }
    .fh-bench-row {
      display: flex; align-items: flex-start; justify-content: center;
      gap: 1rem; flex-wrap: wrap; padding: 0.75rem 1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 0 0 8px 8px; border-top: none;
    }
    .fh-bench-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .fh-bench-shirt { width: 28px; height: 31px; }
    .fh-bench-shirt svg { width: 100%; height: 100%; opacity: .75; }
    .fh-bench-lbl { font-size: 0.5625rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    .fh-bench-fix { font-size: 0.4375rem; color: var(--text-muted); white-space: nowrap; }
  </style>
  <style>
    /* ── Page layout ─────────────────────────── */
    .chips-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 680px) {
      .chips-grid { grid-template-columns: 1fr; }
    }

    /* ── Availability strip ──────────────────── */
    .avail-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
      margin-top: 1.5rem;
    }
    .avail-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.3125rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .avail-pill.available {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(22,163,74,.2);
    }
    .avail-pill.used {
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      text-decoration: line-through;
      opacity: 0.7;
    }
    .avail-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .available .avail-dot { background: var(--success); }
    .used .avail-dot      { background: var(--text-subtle); }

    /* ── Chip cards ──────────────────────────── */
    .chip-card-full {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--sh-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chip-card-full.used-chip {
      opacity: 0.6;
    }

    .chip-card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem 0.875rem;
      border-bottom: 1px solid var(--border);
    }
    .chip-icon-lg {
      width: 38px; height: 38px;
      border-radius: var(--r);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chip-icon-lg svg { width: 20px; height: 20px; }

    .chip-icon-lg.tc { background: #fef3c7; color: #92400e; }
    .chip-icon-lg.bb { background: #dbeafe; color: #1e40af; }
    .chip-icon-lg.fh { background: #dcfce7; color: #166534; }
    .chip-icon-lg.wc { background: #f3e8ff; color: #7e22ce; }

    [data-theme="dark"] .chip-icon-lg.tc { background: #451a03; color: #fbbf24; }
    [data-theme="dark"] .chip-icon-lg.bb { background: #172554; color: #93c5fd; }
    [data-theme="dark"] .chip-icon-lg.fh { background: #052e16; color: #86efac; }
    [data-theme="dark"] .chip-icon-lg.wc { background: #2e1065; color: #d8b4fe; }

    .chip-header-text { flex: 1; min-width: 0; }
    .chip-header-name {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .chip-header-gw {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 0.125rem;
    }

    .chip-avail-badge {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 0.1875rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .chip-avail-badge.available { background: var(--success-bg); color: var(--success); }
    .chip-avail-badge.used      { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }

    .chip-card-body {
      padding: 1rem 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .chip-reason {
      font-size: 0.8125rem;
      color: var(--text-2);
      line-height: 1.55;
    }

    /* ── Projected pts callout ───────────────── */
    .pts-callout {
      display: flex;
      align-items: baseline;
      gap: 0.375rem;
      padding: 0.625rem 0.875rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
    }
    .pts-callout .pts-num {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .pts-callout .pts-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── TC candidates table ─────────────────── */
    .candidates-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }
    .candidates-table th {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: left;
      padding: 0 0 0.375rem;
      border-bottom: 1px solid var(--border);
    }
    .candidates-table td {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
      vertical-align: middle;
    }
    .candidates-table tr:last-child td { border-bottom: none; }
    .candidates-table .rank {
      font-size: 0.6875rem;
      font-weight: 700;
      color: var(--text-muted);
      width: 20px;
    }
    .candidates-table .player-name { font-weight: 600; color: var(--text); }
    .candidates-table .score-col {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--text);
    }
    .dgw-badge {
      display: inline-block;
      font-size: 0.5625rem;
      font-weight: 700;
      padding: 0.125rem 0.375rem;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      margin-left: 0.375rem;
      vertical-align: middle;
    }
    [data-theme="dark"] .dgw-badge { background: #451a03; color: #fbbf24; }

    /* ── DGW player tags ─────────────────────── */
    .player-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
    }
    .player-tag {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 0.1875rem 0.5rem;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
    }

    /* ── Free Hit windows list ───────────────── */
    .fh-window {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
    }
    .fh-window + .fh-window { margin-top: 0.5rem; }
    .fh-window.primary-window {
      border-color: var(--error);
      background: var(--error-bg);
    }
    .fh-window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .fh-window-gw {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text);
    }
    .fh-window-blanks {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 0.1875rem 0.5rem;
      border-radius: 999px;
      background: var(--error-bg);
      color: var(--error);
    }
    .fh-window.primary-window .fh-window-gw { color: var(--error); }
    .fh-window-pts {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .fh-window-pts strong { color: var(--text-2); }

    /* ── WC number badge ─────────────────────── */
    .wc-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.1875rem 0.625rem;
      border-radius: 999px;
      background: #f3e8ff;
      color: #7e22ce;
    }
    [data-theme="dark"] .wc-badge { background: #2e1065; color: #d8b4fe; }

    .section-label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }

    /* ── Empty state ─────────────────────────── */
    .chip-empty {
      padding: 1.25rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    /* ── FH full-width ───────────────────────── */
    .fh-full { grid-column: 1 / -1; }

    /* ── FH squad preview ────────────────────── */
    .fh-preview-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      margin-top: 0.625rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px solid transparent;
      border-radius: var(--r);
      padding: 0.3125rem 0.75rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .fh-preview-btn:hover { background: var(--primary-light); border-color: var(--primary); }
    .fh-preview-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .fh-squad-preview {
      margin-top: 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }
    .fh-squad-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.625rem 0.75rem;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .fh-squad-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
    }
    .fh-squad-meta {
      font-size: 0.6875rem;
      color: var(--text-muted);
    }
    .fh-squad-meta strong { color: var(--text-2); }

    .fh-pos-group { border-bottom: 1px solid var(--border); }
    .fh-pos-group:last-child { border-bottom: none; }
    .fh-pos-label {
      font-size: 0.5625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0.375rem 0.75rem 0.125rem;
    }
    .fh-player-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      font-size: 0.8125rem;
    }
    .fh-player-row:hover { background: var(--surface-2); }
    .fh-player-name { font-weight: 600; color: var(--text); }
    .fh-player-team { font-size: 0.6875rem; color: var(--text-muted); }
    .fh-player-fix {
      font-size: 0.6875rem;
      color: var(--text-muted);
      text-align: right;
      white-space: nowrap;
    }
    .fh-player-price {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-2);
      text-align: right;
      white-space: nowrap;
    }
    .fh-player-pts {
      font-size: 0.6875rem;
      font-weight: 700;
      color: var(--success);
      text-align: right;
      white-space: nowrap;
    }

    /* ── Recent scores strip ────────────────── */
    .scores-strip {
      display: flex;
      gap: 0.625rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    .score-pill {
      flex: 1;
      min-width: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 0.625rem 0.5rem 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
    }
    .score-pill-gw {
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .score-pill-pts {
      font-size: 1.375rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .score-pill-pts.above-avg { color: var(--success); }
    .score-pill-pts.below-avg { color: #ef4444; }
    .score-pill-avg {
      font-size: 0.625rem;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .score-pill-diff {
      font-size: 0.625rem;
      font-weight: 700;
      padding: 0.0625rem 0.3125rem;
      border-radius: 999px;
    }
    .score-pill-diff.pos { background: var(--success-bg); color: var(--success); }
    .score-pill-diff.neg { background: #fee2e2; color: #dc2626; }
    [data-theme="dark"] .score-pill-diff.neg { background: #450a0a; color: #f87171; }

    /* ── Performance alert banner ───────────── */
    .perf-alert {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.875rem 1.125rem;
      background: #fff7ed;
      border: 1px solid #fb923c;
      border-radius: var(--r-lg);
      margin-top: 1.25rem;
      font-size: 0.8125rem;
      color: #7c2d12;
      line-height: 1.5;
    }
    [data-theme="dark"] .perf-alert {
      background: #431407;
      border-color: #ea580c;
      color: #fed7aa;
    }
    .perf-alert-icon {
      font-size: 1.125rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 0.0625rem;
    }
    .perf-alert strong { font-weight: 700; }

    /* ── Urgent wildcard card ────────────────── */
    .chip-card-full.wc-urgent {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249,115,22,.15);
    }
    [data-theme="dark"] .chip-card-full.wc-urgent {
      border-color: #ea580c;
      box-shadow: 0 0 0 3px rgba(234,88,12,.2);
    }
    .urgent-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.1875rem 0.5rem;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fb923c;
      margin-left: 0.5rem;
    }
    [data-theme="dark"] .urgent-badge {
      background: #431407;
      color: #fb923c;
      border-color: #ea580c;
    }

    /* ── WC build link ───────────────────────── */
    .wc-build-link {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid var(--primary);
      border-radius: var(--r);
      transition: background 0.15s;
      margin-top: 0.25rem;
    }
    .wc-build-link:hover { background: var(--primary-light); }
  </style>
</head>
<body>
  <script src="/nav.js?v=7"></script>
  <script src="/kits.js?v=5"></script>
  <div class="container">

    <h1>Chip Planner</h1>
    <p style="color:var(--text-muted);font-size:0.875rem;margin:-0.5rem 0 1.25rem">
      Season-wide chip strategy — availability status, optimal timing, TC candidate rankings,
      Bench Boost projections, and Free Hit blank gameweek detection.
    </p>

    <div class="controls">
      <label for="entry-id" style="font-size:0.8125rem;font-weight:600;color:var(--text-2)">FPL Entry ID</label>
      <input type="number" id="entry-id" placeholder="e.g. 1200601" min="1"
             style="width:160px" value="">
      <button id="btn-load" onclick="loadChips()">Plan Chips</button>
    </div>

    <div id="loading" class="loading">Scanning season fixtures…</div>
    <div id="error" class="msg"></div>

    <div id="results" style="display:none">

      <!-- Last 5 GW scores -->
      <div id="scores-strip" class="scores-strip"></div>

      <!-- Performance alert (shown only when team is struggling) -->
      <div id="perf-alert" style="display:none"></div>

      <!-- Chip availability strip -->
      <div id="avail-strip" class="avail-strip" aria-label="Chip availability"></div>

      <!-- 2-col chip grid -->
      <div class="chips-grid" id="chips-grid"></div>

    </div>
  </div>

  <script>
    const CHIP_SVG = {
      tc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6.5 7 1-5 4.9 1.2 7L12 18l-6.2 3.4L7 14.4 2 9.5l7-1z"/></svg>`,
      bb: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
      fh: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>`,
      wc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
    };

    window.addEventListener('DOMContentLoaded', () => {
      const saved = FPL.getEntryId();
      if (saved) document.getElementById('entry-id').value = saved;
    });

    async function loadChips() {
      const entryInput = document.getElementById('entry-id');
      const entryId = entryInput.value.trim();
      if (!entryId) { FPL.showError('Enter your FPL entry ID.'); return; }
      FPL.setEntryId(entryId);
      FPL.clearError();

      const btn = document.getElementById('btn-load');
      FPL.setLoading(true, btn);
      document.getElementById('results').style.display = 'none';

      try {
        const chips = await FPL.apiFetch(`/api/v1/chip-plan?entry_id=${entryId}`);
        renderScoresStrip(chips.recent_scores || []);
        renderPerformanceAlert(chips.performance_alert);
        renderAvailability(chips.chips_available || {});
        renderChips(chips);
        document.getElementById('results').style.display = '';
      } catch (err) {
        FPL.showError(err.message);
      } finally {
        FPL.setLoading(false, btn);
      }
    }

    function renderScoresStrip(scores) {
      const el = document.getElementById('scores-strip');
      if (!scores.length) { el.innerHTML = ''; return; }
      el.innerHTML = scores.map(s => {
        const diff = s.average != null ? s.points - s.average : null;
        const cls = diff == null ? '' : diff >= 0 ? 'above-avg' : 'below-avg';
        const diffHtml = diff != null
          ? `<span class="score-pill-diff ${diff >= 0 ? 'pos' : 'neg'}">${diff >= 0 ? '+' : ''}${diff}</span>`
          : '';
        const avgHtml = s.average != null
          ? `<span class="score-pill-avg">avg ${s.average}</span>`
          : '';
        return `<div class="score-pill">
          <span class="score-pill-gw">GW${s.gameweek}</span>
          <span class="score-pill-pts ${cls}">${s.points}</span>
          ${avgHtml}
          ${diffHtml}
        </div>`;
      }).join('');
    }

    function renderPerformanceAlert(msg) {
      const el = document.getElementById('perf-alert');
      if (!msg) { el.style.display = 'none'; el.innerHTML = ''; return; }
      el.style.display = '';
      el.innerHTML = `<div class="perf-alert">
        <span class="perf-alert-icon">⚠️</span>
        <span><strong>Your team is struggling.</strong> ${msg}</span>
      </div>`;
    }

    function renderAvailability(avail) {
      const chips = [
        { key: 'triple_captain', label: 'Triple Captain' },
        { key: 'bench_boost',    label: 'Bench Boost' },
        { key: 'free_hit',       label: 'Free Hit' },
        { key: 'wildcard1',      label: 'Wildcard 1 (GW1–20)' },
        { key: 'wildcard2',      label: 'Wildcard 2 (GW21–38)' },
      ];
      const strip = document.getElementById('avail-strip');
      strip.innerHTML = chips.map(({ key, label }) => {
        const ok = avail[key] !== false;
        return `<span class="avail-pill ${ok ? 'available' : 'used'}">
          <span class="avail-dot"></span>${label}${ok ? '' : ' · Used'}
        </span>`;
      }).join('');
    }

    function renderChips(data) {
      const grid = document.getElementById('chips-grid');
      grid.innerHTML = '';

      const avail = data.chips_available || {};
      grid.appendChild(renderTC(data.triple_captain, avail.triple_captain !== false));
      grid.appendChild(renderBB(data.bench_boost, avail.bench_boost !== false));
      grid.appendChild(renderFH(data.free_hit || [], avail.free_hit !== false));
      grid.appendChild(renderWC(data.wildcard, avail));
    }

    function chipCard(type, name, headerExtra, bodyHtml, available, isFullWidth) {
      const div = document.createElement('div');
      div.className = `chip-card-full${available ? '' : ' used-chip'}${isFullWidth ? ' fh-full' : ''}`;
      div.innerHTML = `
        <div class="chip-card-header">
          <div class="chip-icon-lg ${type}">${CHIP_SVG[type]}</div>
          <div class="chip-header-text">
            <div class="chip-header-name">${name}</div>
            ${headerExtra ? `<div class="chip-header-gw">${headerExtra}</div>` : ''}
          </div>
          <span class="chip-avail-badge ${available ? 'available' : 'used'}">${available ? 'Available' : 'Used'}</span>
        </div>
        <div class="chip-card-body">${bodyHtml}</div>`;
      return div;
    }

    function renderTC(tc, available) {
      if (!tc) {
        return chipCard('tc', 'Triple Captain', null,
          `<div class="chip-empty">No future fixture data available.</div>`, available);
      }

      const gwType = tc.is_dgw ? 'Double Gameweek' : 'Best Fixture';
      const candidatesHtml = tc.candidates && tc.candidates.length
        ? `<div>
            <div class="section-label">Top candidates for GW${tc.gameweek}</div>
            <table class="candidates-table">
              <thead><tr>
                <th></th>
                <th>Player</th>
                <th style="text-align:right">Score</th>
              </tr></thead>
              <tbody>
                ${tc.candidates.map((c, i) => `
                  <tr>
                    <td class="rank">${i + 1}</td>
                    <td class="player-name">
                      ${c.player_name}
                      ${c.is_dgw ? '<span class="dgw-badge">DGW</span>' : ''}
                    </td>
                    <td class="score-col">${c.player_score}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`
        : '';

      return chipCard('tc', 'Triple Captain', `GW${tc.gameweek} · ${gwType}`,
        `<p class="chip-reason">${tc.reason}</p>${candidatesHtml}`, available);
    }

    function renderBB(bb, available) {
      if (!bb) {
        return chipCard('bb', 'Bench Boost', null,
          `<div class="chip-empty">No double gameweek windows found for your squad.</div>`, available);
      }

      const projHtml = bb.projected_squad_pts != null
        ? `<div class="pts-callout">
            <span class="pts-num">~${bb.projected_squad_pts}</span>
            <span class="pts-label">projected squad pts (all 15 players)</span>
          </div>`
        : '';

      const tagsHtml = bb.dgw_player_names && bb.dgw_player_names.length
        ? `<div>
            <div class="section-label">Your DGW players</div>
            <div class="player-tags">
              ${bb.dgw_player_names.map(n => `<span class="player-tag">${n}</span>`).join('')}
            </div>
          </div>`
        : '';

      return chipCard('bb', 'Bench Boost', `GW${bb.gameweek} · ${bb.dgw_count} DGW players`,
        `<p class="chip-reason">${bb.reason}</p>${projHtml}${tagsHtml}`, available);
    }

    function renderFH(windows, available) {
      if (!windows.length) {
        return chipCard('fh', 'Free Hit', null,
          `<div class="chip-empty">No significant blank gameweek windows detected for your squad.</div>`,
          available, true);
      }

      const sorted = [...windows].sort((a, b) => b.blank_count - a.blank_count);
      const primary = sorted[0];
      const others = sorted.slice(1);

      const card = chipCard('fh', 'Free Hit',
        `${windows.length} blank window${windows.length > 1 ? 's' : ''} detected`,
        `<p class="chip-reason">Free Hit replaces your squad for one gameweek and reverts — ideal when most of your players blank. The squad below is optimised specifically for that GW using your actual budget.</p>`,
        available, true);

      const body = card.querySelector('.chip-card-body');

      // Primary window
      const primaryDiv = document.createElement('div');
      primaryDiv.innerHTML = `
        <div class="section-label">Worst blank gameweek</div>
        <div class="fh-window primary-window" id="fh-primary-window">
          <div class="fh-window-header">
            <span class="fh-window-gw">GW${primary.gameweek}</span>
            <span class="fh-window-blanks">${primary.blank_count} blankers</span>
          </div>
          ${primary.squad_projected_pts != null
            ? `<div class="fh-window-pts">Current squad projects <strong>~${primary.squad_projected_pts} pts</strong> this GW</div>`
            : ''}
          <button class="fh-preview-btn" onclick="previewFHSquad(${primary.gameweek}, this)">
            Preview Free Hit squad →
          </button>
          <div class="fh-squad-preview" id="fh-preview-${primary.gameweek}" style="display:none"></div>
        </div>`;
      body.appendChild(primaryDiv);

      // Other windows
      if (others.length) {
        const othersDiv = document.createElement('div');
        othersDiv.innerHTML = `<div class="section-label" style="margin-top:0.75rem">Other blank windows</div>`;
        others.forEach(w => {
          const wDiv = document.createElement('div');
          wDiv.innerHTML = `
            <div class="fh-window" style="margin-top:0.5rem">
              <div class="fh-window-header">
                <span class="fh-window-gw">GW${w.gameweek}</span>
                <span class="fh-window-blanks">${w.blank_count} blankers</span>
              </div>
              ${w.squad_projected_pts != null
                ? `<div class="fh-window-pts">Current squad projects <strong>~${w.squad_projected_pts} pts</strong> this GW</div>`
                : ''}
              <button class="fh-preview-btn" onclick="previewFHSquad(${w.gameweek}, this)">
                Preview Free Hit squad →
              </button>
              <div class="fh-squad-preview" id="fh-preview-${w.gameweek}" style="display:none"></div>
            </div>`;
          othersDiv.appendChild(wDiv);
        });
        body.appendChild(othersDiv);
      }

      return card;
    }

    const _fhState = {};
    const FH_ROW_Y = { GKP: 12, DEF: 33, MID: 56, FWD: 81 };

    function fhInjuryBadge(p) {
      const s = p.status || 'a';
      const c = p.chance_of_playing_next_round;
      if (s === 'i' || s === 's' || s === 'u' || c === 0)
        return `<span class="fh-inj-dot out">!</span>`;
      if (s === 'd' || (c != null && c < 75))
        return `<span class="fh-inj-dot doubtful">!</span>`;
      if (c != null && c < 100)
        return `<span class="fh-inj-dot concern">!</span>`;
      return '';
    }

    function fhPlacePlayer(pitchEl, p, x, y, captainId, vcId) {
      const { teamColours, abbr, shirtSvg } = FPLKits;
      const [fill, stroke] = teamColours(p);
      const node = document.createElement('div');
      node.className = 'fh-player-node';
      node.style.left = x + '%';
      node.style.top = y + '%';
      const cap = p.id === captainId ? '<span class="fh-cap-dot">C</span>' : (p.id === vcId ? '<span class="fh-cap-dot vc">V</span>' : '');
      const fix = p.next_fixture || p.fixture_label;
      const isDgw = fix && fix.includes('DGW');
      const fixHtml = fix ? `<div class="fh-fix${isDgw ? ' dgw' : ''}">${fix}</div>` : '';
      node.innerHTML = `
        <div class="fh-shirt-wrap">${shirtSvg(fill, stroke, abbr(p.web_name))}${cap}${fhInjuryBadge(p)}</div>
        <div class="fh-plbl">${p.web_name}</div>
        ${fixHtml}`;
      pitchEl.appendChild(node);
    }

    function fhRenderPitch(pitchEl, startingXi, captainId, vcId) {
      const { spreadX, PITCH_SVG } = FPLKits;
      pitchEl.innerHTML = PITCH_SVG;
      const groups = { GKP: [], DEF: [], MID: [], FWD: [] };
      for (const p of startingXi) groups[p.position].push(p);
      for (const [pos, players] of Object.entries(groups)) {
        players.forEach((p, i) => fhPlacePlayer(pitchEl, p, spreadX(players.length, i), FH_ROW_Y[pos], captainId, vcId));
      }
    }

    function fhRenderBench(benchRowEl, bench) {
      const { teamColours, abbr, shirtSvg } = FPLKits;
      benchRowEl.innerHTML = bench.map(p => {
        const [fill, stroke] = teamColours(p);
        const fix = p.next_fixture || p.fixture_label;
        const fixHtml = fix ? `<div class="fh-bench-fix">${fix}</div>` : '';
        return `<div class="fh-bench-item">
          <div class="fh-bench-shirt" style="position:relative">${shirtSvg(fill, stroke, abbr(p.web_name))}${fhInjuryBadge(p)}</div>
          <div class="fh-bench-lbl">${p.web_name}</div>
          ${fixHtml}
        </div>`;
      }).join('');
    }

    function fhShowView(gameweek, isFH) {
      const state = _fhState[gameweek];
      if (!state) return;
      const pitchEl = document.getElementById(`fh-pitch-${gameweek}`);
      const benchEl = document.getElementById(`fh-bench-${gameweek}`);
      const metaEl  = document.getElementById(`fh-meta-${gameweek}`);
      const btnCur  = document.getElementById(`fh-btn-cur-${gameweek}`);
      const btnFH   = document.getElementById(`fh-btn-fh-${gameweek}`);

      if (isFH) {
        fhRenderPitch(pitchEl, state.fhData.starting_xi, state.fhData.captain_id, state.fhData.vice_captain_id);
        fhRenderBench(benchEl, state.fhData.bench);
        metaEl.innerHTML = `Free Hit · GW${gameweek} · £${state.fhData.total_cost.toFixed(1)}m / £${state.fhData.budget.toFixed(1)}m · <strong>~${state.fhData.projected_gw_pts} pts</strong>`;
      } else {
        const ld = state.lineupData;
        const bench = [ld.bench_gk, ...(ld.bench_outfield || [])].filter(Boolean);
        fhRenderPitch(pitchEl, ld.starting_xi, ld.captain.id, ld.vice_captain.id);
        fhRenderBench(benchEl, bench);
        metaEl.innerHTML = `Your current squad`;
      }

      btnCur.style.background = isFH ? 'var(--surface)' : 'var(--primary)';
      btnCur.style.color = isFH ? 'var(--text-muted)' : '#fff';
      btnCur.style.borderColor = isFH ? 'var(--border)' : 'var(--primary)';
      btnFH.style.background = isFH ? 'var(--primary)' : 'var(--surface)';
      btnFH.style.color = isFH ? '#fff' : 'var(--text-muted)';
      btnFH.style.borderColor = isFH ? 'var(--primary)' : 'var(--border)';
    }

    async function previewFHSquad(gameweek, btn) {
      const entryId = document.getElementById('entry-id').value.trim();
      const previewEl = document.getElementById(`fh-preview-${gameweek}`);
      if (!previewEl) return;

      btn.disabled = true;
      btn.textContent = 'Building squad…';
      previewEl.style.display = '';
      previewEl.innerHTML = '<div style="padding:0.75rem;font-size:0.8125rem;color:var(--text-muted)">Optimising…</div>';

      try {
        const [fhData, lineupData] = await Promise.all([
          FPL.apiFetch(`/api/v1/fh-squad?entry_id=${entryId}&gameweek=${gameweek}`),
          FPL.apiFetch(`/api/v1/lineup?entry_id=${entryId}`),
        ]);

        _fhState[gameweek] = { fhData, lineupData };

        previewEl.innerHTML = `
          <div style="margin-top:0.5rem">
            <div class="fh-pitch-toggle">
              <button id="fh-btn-cur-${gameweek}" onclick="fhShowView(${gameweek}, false)"
                style="font-size:0.75rem;padding:0.25rem 0.75rem;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-weight:600">Current</button>
              <button id="fh-btn-fh-${gameweek}" onclick="fhShowView(${gameweek}, true)"
                style="font-size:0.75rem;padding:0.25rem 0.75rem;border-radius:var(--r-md);border:1.5px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;font-weight:600">Free Hit squad</button>
            </div>
            <div style="font-size:0.6875rem;color:var(--text-muted);text-align:center;margin-bottom:0.375rem" id="fh-meta-${gameweek}"></div>
            <div class="fh-pitch-wrap" id="fh-pitch-${gameweek}"></div>
            <div class="fh-bench-row" id="fh-bench-${gameweek}"></div>
          </div>`;

        fhShowView(gameweek, true);
        btn.style.display = 'none';
      } catch (err) {
        previewEl.innerHTML = `<div style="padding:0.75rem;font-size:0.8125rem;color:var(--error)">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Preview Free Hit squad →';
      }
    }

    function renderWC(wc, avail) {
      const wcNumber = wc ? wc.wc_number || 1 : null;
      const wcAvailable = wcNumber === 1 ? avail.wildcard1 !== false : avail.wildcard2 !== false;
      const wcAvailBoth = avail.wildcard1 !== false || avail.wildcard2 !== false;

      if (!wc) {
        return chipCard('wc', 'Wildcard', null,
          `<div class="chip-empty">No significant fixture difficulty cliff detected. Squad looks stable.</div>`,
          wcAvailBoth);
      }

      const wcBadge = `<span class="wc-badge">Wildcard ${wcNumber} · GW${wcNumber === 1 ? '1–20' : '21–38'}</span>`;
      const urgentBadge = wc.urgent ? `<span class="urgent-badge">⚠ Use now</span>` : '';

      const card = chipCard('wc', 'Wildcard', `GW${wc.gameweek}`,
        `<p style="margin:0">${wcBadge}${urgentBadge}</p>
         <p class="chip-reason">${wc.reason}</p>
         <p class="chip-reason" style="font-size:0.75rem;color:var(--text-muted);margin:0">
           Wildcard completely rebuilds your squad. Use Best Squad to see the optimal 15-man team right now.
         </p>
         <a href="/optimize.html" class="wc-build-link">
           Build Wildcard squad →
         </a>`,
        wcAvailable);

      if (wc.urgent) card.classList.add('wc-urgent');
      return card;
    }
  </script>
</body>
</html>
